server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas de React Router (SPA): cualquier ruta
    # desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos generados por Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
    }
}
